name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-validation:
    name: Stack and landing validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          DB_MYSQL_PASSWORD=ci-db-password DB_ROOT_PASSWORD=ci-root-password \
            docker compose config --quiet

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          sh -n backup-ui/backup.sh backup-ui/restore.sh backup-ui/start.sh

      - name: Validate backup companion Python
        run: python3 -m py_compile backup-ui/server.py

      - name: Validate Cerulean local-BIND integration
        run: |
          set -euo pipefail
          test -f compose.cerulean.yml
          grep -q 'BIND_MODE=local' compose.cerulean.yml
          grep -q 'backup-ui' compose.cerulean.yml

      - name: No credentials or private runtime data in tracked files
        run: |
          set -euo pipefail
          # .env.example is the canonical template and is required to be tracked —
          # exclude it; everything else under .env/ data/ mysql/ letsencrypt/ backups/
          # is private runtime data and must never be committed.
          test -z "$(git ls-files | grep -E '(^|/)(\.env|data/|mysql/|letsencrypt/|backups/)' | grep -v '^\.env\.example$' || true)"
          if grep -RInE 'DB_(MYSQL_PASSWORD|ROOT_PASSWORD)=(change-me|change-me-too)' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.html' . 2>/dev/null; then
            echo "Placeholder database values should not be copied into public deployment files"
            exit 1
          fi

      - name: Landing page has no local-only public URLs
        run: |
          set -euo pipefail
          if grep -nE 'http://localhost:[0-9]+|127\.0\.0\.1:[0-9]+|10\.42\.|172\.(1[6-9]|2[0-9]|3[01])\.' web/landing/index.html; then
            echo "Local-only or Docker-bridge address found in public landing page"
            exit 1
          fi
