# ═══════════════════════════════════════════════════════════════════════════
# release.yml — NPM Edge release pipeline.
#
# Fires on every `v*` tag push (and on demand via workflow_dispatch):
#   release — bundles the source + compose stack + docs snapshot and cuts the
#   GitHub Release with the bundle + checksums and generated release notes.
#
# NPM Edge has no first-party Docker image (Nginx Proxy Manager + MariaDB are
# compose-managed upstream images); the artifact is the reproducible stack
# bundle.
# ═══════════════════════════════════════════════════════════════════════════

name: NPM Edge release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to build (default: use the pushed tag)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: npm-edge-release
  cancel-in-progress: false

jobs:
  release:
    name: Cut the NPM Edge release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [[ ! "$VERSION" =~ ^v ]]; then
              VERSION="v$VERSION"
            fi
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release: $VERSION"

      - name: Build the source bundle
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.version }}"
          ARCHIVE="npm-edge-${VERSION#v}.tar.gz"
          mkdir -p dist
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.gitignore' \
            -czf "dist/$ARCHIVE" \
            README.md ABOUT.md SECURITY.md LICENSE docker-compose.yml \
            compose.cerulean.yml docs scripts docker frontend backend \
            backup-ui test web .env.example
          (cd dist && sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256")
          ls -lh dist/
          echo "bundle=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION}"
          NOTES=$(printf '%s\n' \
            "NPM Edge **${VERSION}** — the EdgeOps layer of the Innotel Platform Stack: public HTTP/S routing, TLS termination, and recoverable proxy configuration." \
            "" \
            "This release bundles the reproducible compose stack + docs snapshot used to deploy the EdgeOps layer." \
            "" \
            "**Artifact**" \
            "- npm-edge-${VERSION#v}.tar.gz + sha256" \
            "" \
            "**See also**" \
            "- [docs/stack.md](https://github.com/innotelinc/npm/blob/main/docs/stack.md) — the owns/consumes map" \
            "- [docs/standard.md](https://github.com/innotelinc/innotel-platform-stack/blob/main/docs/standard.md) — the repo conformity standard" \
            "- [scripts/conform-project.sh](https://github.com/innotelinc/innotel-platform-stack/blob/main/scripts/conform-project.sh) — the scaffold/audit tool")
          ARCHIVE="npm-edge-${VERSION#v}.tar.gz"
          gh release create "$VERSION" \
            "dist/$ARCHIVE" \
            "dist/$ARCHIVE.sha256" \
            --title "NPM Edge $VERSION" \
            --notes "$NOTES" || \
          gh release upload "$VERSION" \
            "dist/$ARCHIVE" \
            "dist/$ARCHIVE.sha256" --clobber
          echo "::notice::released $VERSION"