add_header       X-Served-By $host;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Scheme $x_forwarded_scheme;
proxy_set_header X-Forwarded-Proto  $x_forwarded_proto;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP          $remote_addr;
# SSO identity is set by the SSO gateway (oauth2-proxy), never by the client.
# A browser can reach most hosts through the upstream untouched on an API
# skip-auth route, so anything it sent under these names is dropped here before
# the gateway (or the app) sees it; the gateway sets the real values itself on
# authenticated requests. Without this a client-supplied X-Forwarded-Email
# would ride through a skip-auth route and be believed by the app.
proxy_set_header X-Forwarded-User                 "";
proxy_set_header X-Forwarded-Email                "";
proxy_set_header X-Forwarded-Groups               "";
proxy_set_header X-Forwarded-Preferred-Username   "";
proxy_pass       $forward_scheme://$server:$port$request_uri;

